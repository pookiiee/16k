<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookie Dress Up ✨ 16K Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffd1dc;
            --soft-pink: #ffb7c5;
            --dark-pink: #ff85a1;
            --accent-pink: #f72585;
            --bg-creamy: #fff5f7;
            --text-color: #5c3d4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Tajawal', cursive, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--baby-pink);
            background-image: radial-gradient(#ffb7c5 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.3rem;
            color: #fff;
            text-shadow: 3px 3px 0px var(--dark-pink), 5px 5px 0px rgba(0,0,0,0.06);
            letter-spacing: 1px;
        }

        .badge {
            background: #fff;
            color: var(--accent-pink);
            padding: 4px 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-block;
            margin-top: 4px;
            box-shadow: 0 4px 10px rgba(255, 133, 161, 0.3);
            border: 2px dashed var(--soft-pink);
        }

        .game-wrapper {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(247, 37, 133, 0.15);
            display: flex;
            flex-direction: row;
            gap: 25px;
            max-width: 900px;
            width: 100%;
            border: 4px solid #fff;
        }

        /* منطقة عرض الشخصية */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-creamy);
            border-radius: 24px;
            padding: 15px;
            position: relative;
            border: 3px dashed var(--soft-pink);
            min-height: 440px;
        }

        .doll-stage {
            position: relative;
            width: 260px;
            height: 380px;
        }

        .doll-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* لوحة التحكم والخيارات */
        .controls-area {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #fff;
            border: 2px solid var(--soft-pink);
            color: var(--text-color);
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--dark-pink);
            color: #fff;
            border-color: var(--dark-pink);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 133, 161, 0.4);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }

        .item-card {
            background: #fff;
            border: 2px solid #ffe3ea;
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .item-card:hover {
            transform: scale(1.04);
            border-color: var(--dark-pink);
            background: #fffafa;
        }

        .item-card.selected {
            border-color: var(--accent-pink);
            background: #ffe9f0;
            box-shadow: 0 0 0 2px var(--accent-pink);
        }

        .item-card span {
            font-size: 1.8rem;
        }

        .item-card p {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-random {
            background: #ffe3ea;
            color: var(--text-color);
        }

        .btn-random:hover {
            background: #ffd1dc;
        }

        .btn-save {
            background: var(--dark-pink);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 133, 161, 0.4);
        }

        .btn-save:hover {
            background: var(--accent-pink);
        }

        /* متجاوب مع شاشات الهواتف */
        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .controls-area {
                width: 100%;
            }
            .items-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎀 Pookie Dress-Up 🎀</h1>
        <div class="badge">🎉 احتفالية 16,000 عضوة! 🎉</div>
    </header>

    <div class="game-wrapper">
        <!-- شاشة اللعبة وعرض الشخصية -->
        <div class="preview-area" id="capture-area">
            <div class="doll-stage">
                <!-- طبقة الشعر الخلفي -->
                <svg id="layer-backhair" class="doll-layer" viewBox="0 0 260 380"></svg>
                
                <!-- طبقة الجسم -->
                <svg id="layer-body" class="doll-layer" viewBox="0 0 260 380">
                    <!-- الظلال والجسم الأساسي -->
                    <rect id="skin-neck" x="122" y="115" width="16" height="30" rx="6" fill="#ffe0bd" />
                    <!-- الرأس -->
                    <ellipse id="skin-head" cx="130" cy="80" rx="35" ry="40" fill="#ffe0bd" />
                    <!-- الخدود الوردية -->
                    <circle cx="112" cy="90" r="6" fill="#ffb7c5" opacity="0.6"/>
                    <circle cx="148" cy="90" r="6" fill="#ffb7c5" opacity="0.6"/>
                    <!-- العيون اللطيفة -->
                    <ellipse cx="115" cy="80" rx="4" ry="5.5" fill="#3c2f2f"/>
                    <ellipse cx="145" cy="80" rx="4" ry="5.5" fill="#3c2f2f"/>
                    <circle cx="116" cy="78" r="1.5" fill="#fff"/>
                    <circle cx="146" cy="78" r="1.5" fill="#fff"/>
                    <!-- الرموش -->
                    <path d="M 110 74 Q 115 72 120 74" stroke="#3c2f2f" stroke-width="1.5" fill="none"/>
                    <path d="M 140 74 Q 145 72 150 74" stroke="#3c2f2f" stroke-width="1.5" fill="none"/>
                    <!-- الابتسامة -->
                    <path d="M 126 94 Q 130 98 134 94" stroke="#e07a5f" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- الجذع واليدين والأرجل -->
                    <rect id="skin-body" x="110" y="135" width="40" height="75" rx="10" fill="#ffe0bd" />
                    <!-- اليدين -->
                    <rect id="skin-arm-l" x="96" y="140" width="12" height="90" rx="6" transform="rotate(10 96 140)" fill="#ffe0bd" />
                    <rect id="skin-arm-r" x="152" y="140" width="12" height="90" rx="6" transform="rotate(-10 152 140)" fill="#ffe0bd" />
                    <!-- الساقين -->
                    <rect id="skin-leg-l" x="112" y="210" width="15" height="120" rx="7" fill="#ffe0bd" />
                    <rect id="skin-leg-r" x="133" y="210" width="15" height="120" rx="7" fill="#ffe0bd" />
                </svg>

                <!-- طبقة الملابس السفلية / الفستان -->
                <svg id="layer-bottom" class="doll-layer" viewBox="0 0 260 380"></svg>

                <!-- طبقة الملابس العلوية -->
                <svg id="layer-top" class="doll-layer" viewBox="0 0 260 380"></svg>

                <!-- طبقة الشعر الأمامي والغرة -->
                <svg id="layer-fronthair" class="doll-layer" viewBox="0 0 260 380"></svg>

                <!-- طبقة الإكسسوارات -->
                <svg id="layer-accessory" class="doll-layer" viewBox="0 0 260 380"></svg>
            </div>
        </div>

        <!-- القوائم والخيارات -->
        <div class="controls-area">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('hair')">💇‍♀️ الشعر</button>
                <button class="tab-btn" onclick="switchTab('outfits')">👗 الأزياء</button>
                <button class="tab-btn" onclick="switchTab('acc')">✨ إكسسوار</button>
                <button class="tab-btn" onclick="switchTab('skin')">🌸 البشرة</button>
            </div>

            <div class="items-grid" id="grid-items">
                <!-- العناصر تظهر هنا تلقائياً -->
            </div>

            <div class="actions">
                <button class="action-btn btn-random" onclick="randomize()">🎲 إطلالة عشوائية</button>
                <button class="action-btn btn-save" onclick="saveLook()">📷 حفظ الإطلالة</button>
            </div>
        </div>
    </div>

    <!-- مكتبة خفيفة لتحويل التصميم إلى صورة للتحميل -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        // إعدادات وبيانات الملابس والعناصر
        const state = {
            hair: 0,
            hairColor: '#4a2810',
            outfit: 0,
            accessory: 0,
            skinColor: '#ffe0bd'
        };

        const hairStyles = [
            { id: 0, name: "ناعم كلاسيك", icon: "👧" },
            { id: 1, name: "كعكتين لطيفة", icon: "👱‍♀️" },
            { id: 2, name: "شعر مموج كيرلي", icon: "👩‍🦱" },
            { id: 3, name: "بوي كت قصير", icon: "💇" }
        ];

        const outfits = [
            { id: 0, name: "فستان وردي Pookie", icon: "👗" },
            { id: 1, name: "طقم أميرة كلاسيكي", icon: "👚" },
            { id: 2, name: "ستريت ستايل كاجوال", icon: "🎀" },
            { id: 3, name: "فستان كيتي ناعم", icon: "✨" }
        ];

        const accessories = [
            { id: 0, name: "فيونكة وردية", icon: "🎀" },
            { id: 1, name: "تاج ملكي 16K", icon: "👑" },
            { id: 2, name: "نظارة كيوت وردية", icon: "👓" },
            { id: 3, name: "بدون إكسسوار", icon: "❌" }
        ];

        const skins = [
            { color: "#ffe0bd", name: "فاتح كلاسيك" },
            { color: "#ffd1a4", name: "دافئ طبيعي" },
            { color: "#d99b66", name: "حنطي تان" },
            { color: "#8d5524", name: "برونزي غني" }
        ];

        let currentTab = 'hair';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderOptions();
        }

        function renderOptions() {
            const grid = document.getElementById('grid-items');
            grid.innerHTML = '';

            if (currentTab === 'hair') {
                hairStyles.forEach(item => {
                    const card = document.createElement('div');
                    card.className = item-card ${state.hair === item.id ? 'selected' : ''};
                    card.innerHTML = <span>${item.icon}</span><p>${item.name}</p>;
                    card.onclick = () => { state.hair = item.id; updateDoll(); renderOptions(); };
                    grid.appendChild(card);
                });
            } else if (currentTab === 'outfits') {
                outfits.forEach(item => {
                    const card = document.createElement('div');
                    card.className = item-card ${state.outfit === item.id ? 'selected' : ''};
                    card.innerHTML = <span>${item.icon}</span><p>${item.name}</p>;
                    card.onclick = () => { state.outfit = item.id; updateDoll(); renderOptions(); };
                    grid.appendChild(card);
                });
            } else if (currentTab === 'acc') {
                accessories.forEach(item => {
                    const card = document.createElement('div');
                    card.className = item-card ${state.accessory === item.id ? 'selected' : ''};
                    card.innerHTML = <span>${item.icon}</span><p>${item.name}</p>;
                    card.onclick = () => { state.accessory = item.id; updateDoll(); renderOptions(); };
                    grid.appendChild(card);
                });
            } else if (currentTab === 'skin') {
                skins.forEach(item => {
                    const card = document.createElement('div');
                    card.className = item-card ${state.skinColor === item.color ? 'selected' : ''};
                    card.innerHTML = <span style="display:inline-block;width:32px;height:32px;border-radius:50%;background:${item.color};border:2px solid #ccc;"></span><p>${item.name}</p>;
                    card.onclick = () => { state.skinColor = item.color; updateDoll(); renderOptions(); };
                    grid.appendChild(card);
                });
            }
        }

        function updateDoll() {
            // تحديث البشرة
            ['skin-neck', 'skin-head', 'skin-body', 'skin-arm-l', 'skin-arm-r', 'skin-leg-l', 'skin-leg-r'].forEach(id => {
                document.getElementById(id).setAttribute('fill', state.skinColor);
            });

            // طبقات الشعر
            const backHair = document.getElementById('layer-backhair');
            const frontHair = document.getElementById('layer-fronthair');
            backHair.innerHTML = '';
            frontHair.innerHTML = '';

            if (state.hair === 0) { // ناعم طويل
                backHair.innerHTML = <path d="M 85 80 C 80 180 90 230 100 250 L 160 250 C 170 230 180 180 175 80 Z" fill="${state.hairColor}"/>;
                frontHair.innerHTML = <path d="M 95 75 Q 130 50 165 75 Q 150 95 130 85 Q 110 95 95 75 Z" fill="${state.hairColor}"/>;
            } else if (state.hair === 1) { // كعكتين
                backHair.innerHTML = `
                    <circle cx="85" cy="50" r="22" fill="${state.hairColor}"/>
                    <circle cx="175" cy="50" r="22" fill="${state.hairColor}"/>
                `;
                frontHair.innerHTML = <path d="M 95 70 Q 130 55 165 70 Q 155 90 130 85 Q 105 90 95 70 Z" fill="${state.hairColor}"/>;
            } else if (state.hair === 2) { // كيرلي
                backHair.innerHTML = <ellipse cx="130" cy="110" rx="55" ry="60" fill="${state.hairColor}"/>;
                frontHair.innerHTML = <path d="M 95 75 C 110 60 150 60 165 75 C 150 90 110 90 95 75 Z" fill="${state.hairColor}"/>;
            } else if (state.hair === 3) { // قصير
                frontHair.innerHTML = <path d="M 90 75 Q 130 45 170 75 C 175 110 165 125 155 120 C 150 95 110 95 105 120 C 95 125 85 110 90 75 Z" fill="${state.hairColor}"/>;
            }

            // طبقات الملابس
            const topLayer = document.getElementById('layer-top');
            const bottomLayer = document.getElementById('layer-bottom');
            topLayer.innerHTML = '';
            bottomLayer.innerHTML = '';

            if (state.outfit === 0) { // فستان وردي Pookie
                topLayer.innerHTML = `
                    <path d="M 110 135 L 150 135 L 155 180 L 105 180 Z" fill="#ff758f"/>
                    <!-- تفاصيل الياقة اللطيفة -->
                    <circle cx="130" cy="140" r="4" fill="#fff"/>
                `;
                bottomLayer.innerHTML = `
                    <path d="M 105 178 L 155 178 L 175 235 L 85 235 Z" fill="#ffb3c1"/>
                    <path d="M 85 235 Q 130 250 175 235" stroke="#ff758f" stroke-width="4" fill="none"/>
                `;
            } else if (state.outfit === 1) { // طقم كلاسيكي أزرق ناعم وأبيض
                topLayer.innerHTML = `
                    <rect x="110" y="135" width="40" height="40" rx="4" fill="#ffffff"/>
                    <polygon points="120,135 140,135 130,150" fill="#a2d2ff"/>
                `;
                bottomLayer.innerHTML = `
                    <path d="M 108 175 L 152 175 L 165 215 L 95 215 Z" fill="#bde0fe"/>
                `;
            } else if (state.outfit === 2) { // كاجوال توب بنفسجي وهوت شورت
                topLayer.innerHTML = `
                    <rect x="112" y="140" width="36" height="30" rx="5" fill="#cdb4db"/>
                    <circle cx="130" cy="155" r="5" fill="#ffc8dd"/>
                `;
                bottomLayer.innerHTML = `
                    <rect x="110" y="172" width="40" height="28" rx="6" fill="#8338ec"/>
                `;
            } else if (state.outfit === 3) { // فستان أصفر مشمس مع قلوب
                topLayer.innerHTML = `
                    <path d="M 112 135 L 148 135 L 152 175 L 108 175 Z" fill="#ffeaa7"/>
                `;
                bottomLayer.innerHTML = `
                    <path d="M 108 175 L 152 175 L 170 230 L 90 230 Z" fill="#ffeaa7"/>
                    <circle cx="130" cy="205" r="4" fill="#ff7675"/>
                `;
            }

            // طبقة الإكسسوارات
            const accLayer = document.getElementById('layer-accessory');
            accLayer.innerHTML = '';

            if (state.accessory === 0) { // فيونكة
                accLayer.innerHTML = `
                    <path d="M 120 45 Q 130 52 140 45 Q 130 65 120 45 Z" fill="#ff4d6d"/>
                    <circle cx="130" cy="49" r="3" fill="#fff"/>
                `;
            } else if (state.accessory === 1) { // تاج 16K
                accLayer.innerHTML = `
                    <polygon points="115,45 120,30 130,40 140,30 145,45" fill="#ffd700" stroke="#f39c12" stroke-width="1.5"/>
                    <circle cx="130" cy="38" r="2.5" fill="#e74c3c"/>
                `;
            } else if (state.accessory === 2) { // نظارات
                accLayer.innerHTML = `
                    <circle cx="115" cy="80" r="10" stroke="#f72585" stroke-width="2.5" fill="rgba(255,255,255,0.3)"/>
                    <circle cx="145" cy="80" r="10" stroke="#f72585" stroke-width="2.5" fill="rgba(255,255,255,0.3)"/>
                    <line x1="125" y1="80" x2="135" y2="80" stroke="#f72585" stroke-width="2.5"/>
                `;
            }
        }

        function randomize() {
            state.hair = Math.floor(Math.random() * hairStyles.length);
            state.outfit = Math.floor(Math.random() * outfits.length);
            state.accessory = Math.floor(Math.random() * accessories.length);
            state.skinColor = skins[Math.floor(Math.random() * skins.length)].color;
            
            const colors = ['#4a2810', '#111111', '#c77dff', '#ff758f', '#e63946'];
            state.hairColor = colors[Math.floor(Math.random() * colors.length)];

            updateDoll();
            renderOptions();
        }

        function saveLook() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-pookie-doll.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // البدء الأولي
        renderOptions();
        updateDoll();
    </script>
</body>
</html>
