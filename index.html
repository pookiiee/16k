<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 Pookie Chibi Deluxe 🎀 | احتفال 16K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5d8f;
            --primary-hover: #ff3370;
            --primary-light: #fff0f5;
            --primary-border: #ffb3c6;
            --accent: #9d4edd;
            --accent-light: #f3e8ff;
            --bg-color: #ffd6e0;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #442238;
            --text-muted: #835b75;
            --shadow-soft: 0 14px 40px rgba(255, 93, 143, 0.22);
            --shadow-btn: 0 5px 16px rgba(255, 93, 143, 0.3);
            --radius-main: 32px;
            --radius-card: 22px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(var(--primary-border) 2px, transparent 2px),
                radial-gradient(#ffcad4 1.5px, transparent 1.5px);
            background-size: 32px 32px, 16px 16px;
            background-position: 0 0, 16px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background decorative bubbles */
        .bg-sparkle {
            position: absolute;
            pointer-events: none;
            opacity: 0.45;
            animation: floatSlow 6s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-24px) rotate(15deg); }
        }

        /* Top Header */
        header {
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        h1 {
            font-size: 2.35rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                3px 3px 0 var(--primary),
                -1.5px -1.5px 0 var(--primary),
                1.5px -1.5px 0 var(--primary),
                -1.5px 1.5px 0 var(--primary),
                0 6px 15px rgba(255, 93, 143, 0.45);
            letter-spacing: -0.5px;
        }

        .badge-celebration {
            background: linear-gradient(135deg, #fff 0%, #fff0f5 100%);
            color: var(--primary);
            padding: 6px 20px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            border: 2px dashed var(--primary-border);
            box-shadow: 0 4px 12px rgba(255, 93, 143, 0.18);
            animation: pulseSubtle 3s infinite ease-in-out;
        }
        @keyframes pulseSubtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Header Quick Actions */
        .top-tools {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .tool-btn {
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid var(--primary-border);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tool-btn:hover {
            transform: scale(1.12) rotate(6deg);
            border-color: var(--primary);
            background: #fff;
        }

        /* Main Master Container */
        .main-app {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-main);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            display: grid;
            grid-template-columns: 390px 1fr;
            gap: 26px;
            max-width: 1040px;
            width: 100%;
            border: 5px solid #ffffff;
            position: relative;
            z-index: 2;
        }

        /* Stage Column */
        .stage-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .stage-box {
            position: relative;
            width: 100%;
            height: 470px;
            border-radius: var(--radius-card);
            border: 4px solid #fff;
            box-shadow: inset 0 3px 15px rgba(0,0,0,0.04), 0 8px 25px rgba(255, 93, 143, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        /* Canvas Wrapper & SVG */
        .chibi-avatar-wrapper {
            position: relative;
            width: 330px;
            height: 440px;
            cursor: pointer;
            animation: chibiBreathe 4s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes chibiBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.008); }
        }

        .chibi-avatar-wrapper:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        #chibi-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 16px rgba(110, 45, 75, 0.15));
        }

        /* Animated Blinking */
        @keyframes eyesBlink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.06); }
        }
        .anim-eyes {
            transform-origin: 200px 154px;
            animation: eyesBlink 4.2s infinite;
        }

        /* Ahoge bounce */
        @keyframes ahogeWiggle {
            0%, 100% { transform: rotate(0deg); }
            35% { transform: rotate(4deg); }
            70% { transform: rotate(-4deg); }
        }
        .anim-ahoge {
            transform-origin: 200px 95px;
            animation: ahogeWiggle 3.2s ease-in-out infinite;
        }

        /* Pet floating */
        @keyframes petHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .anim-pet {
            animation: petHover 2.6s ease-in-out infinite;
        }

        /* Floating Badge / Name Plate */
        .nameplate-container {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid var(--primary-border);
            border-radius: 18px;
            padding: 6px 12px;
            box-shadow: 0 4px 10px rgba(255, 93, 143, 0.1);
            gap: 8px;
        }
        .nameplate-input {
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            width: 100%;
            background: transparent;
        }
        .nameplate-input::placeholder {
            color: #d19fb5;
            font-weight: 600;
        }

        /* Quick Stage Action Bar */
        .stage-quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-quick {
            border: none;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-quick:active {
            transform: scale(0.94);
        }
        .btn-rand-all {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            color: #6a1b4d;
            box-shadow: 0 4px 12px rgba(255, 112, 166, 0.2);
        }
        .btn-rand-all:hover {
            background: linear-gradient(135deg, #ffd1dc 0%, #ffafcc 100%);
        }
        .btn-reset-all {
            background: #f8f9fa;
            color: var(--text-muted);
            border: 1.5px solid #eee;
        }
        .btn-reset-all:hover {
            background: #f1f3f5;
            color: var(--text);
        }

        /* Right Column: Wardrobe & Controls */
        .controls-column {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Category Nav Tabs */
        .category-scroll-bar {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-border) transparent;
        }
        .category-scroll-bar::-webkit-scrollbar {
            height: 5px;
        }
        .category-scroll-bar::-webkit-scrollbar-thumb {
            background: var(--primary-border);
            border-radius: 10px;
        }

        .cat-tab {
            background: #ffffff;
            border: 2px solid var(--primary-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.86rem;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .cat-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }
        .cat-tab.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 5px 14px rgba(255, 93, 143, 0.35);
        }

        /* Options Grid View */
        .panel-container {
            flex: 1;
            min-height: 310px;
            position: relative;
        }

        .items-panel {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-height: 340px;
            overflow-y: auto;
            padding: 6px 4px 10px 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-border) transparent;
        }
        .items-panel::-webkit-scrollbar {
            width: 6px;
        }
        .items-panel::-webkit-scrollbar-thumb {
            background: var(--primary-border);
            border-radius: 10px;
        }

        .items-panel.active {
            display: grid !important;
            animation: fadeInGrid 0.25s ease-out;
        }
        @keyframes fadeInGrid {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Item Choice Card */
        .item-card {
            background: #ffffff;
            border: 2.5px solid #ffe3ec;
            border-radius: var(--radius-card);
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
            position: relative;
        }
        .item-card:hover {
            transform: translateY(-4px);
            border-color: #ff9ebb;
            box-shadow: 0 6px 16px rgba(255, 93, 143, 0.15);
        }
        .item-card:active {
            transform: scale(0.94);
        }
        .item-card.selected {
            border-color: var(--primary) !important;
            background: #fff3f6 !important;
            box-shadow: 0 0 0 3px rgba(255, 93, 143, 0.25), 0 8px 18px rgba(255, 93, 143, 0.18);
        }
        .item-card.selected::after {
            content: "✓";
            position: absolute;
            top: 6px;
            right: 8px;
            background: var(--primary);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .item-card .card-emoji {
            font-size: 2.1rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
        }
        .item-card .card-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }
        .item-card .card-badge {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--primary);
            background: #ffe8ef;
            padding: 2px 7px;
            border-radius: 8px;
        }

        /* Color Swatches Panel */
        .swatches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            padding: 10px 4px;
        }
        .swatch-card {
            background: #fff;
            border: 2px solid #ffe3ec;
            border-radius: 18px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .swatch-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }
        .swatch-card.selected {
            border-color: var(--primary);
            background: #fff3f6;
            box-shadow: 0 0 0 2px var(--primary);
        }
        .swatch-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .swatch-name {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--text);
        }

        /* Export & Download Hub */
        .bottom-action-bar {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px dashed #ffd1dc;
        }

        .btn-act {
            border: none;
            padding: 13px 12px;
            border-radius: var(--radius-card);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-act:hover {
            transform: translateY(-3px);
        }
        .btn-act:active {
            transform: scale(0.94);
        }

        .btn-download-hd {
            background: linear-gradient(135deg, #ff5d8f 0%, #ff3370 100%);
            color: #ffffff;
            box-shadow: var(--shadow-btn);
        }
        .btn-download-hd:hover {
            box-shadow: 0 7px 20px rgba(255, 93, 143, 0.45);
        }

        .btn-download-pfp {
            background: linear-gradient(135deg, #b5179e 0%, #7209b7 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(114, 9, 183, 0.25);
        }
        .btn-download-pfp:hover {
            box-shadow: 0 7px 20px rgba(114, 9, 183, 0.4);
        }

        .btn-copy-clip {
            background: #ffffff;
            color: var(--text);
            border: 2px solid var(--primary-border);
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .btn-copy-clip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Toast Popup */
        #toast-notice {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: rgba(45, 19, 36, 0.94);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            border: 1.5px solid rgba(255, 93, 143, 0.4);
        }
        #toast-notice.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Floating Sparkle Effect on Click */
        .sparkle-pop {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            animation: popAndFade 0.75s ease-out forwards;
            z-index: 10000;
        }
        @keyframes popAndFade {
            0% { transform: scale(0.3) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) translateY(-25px) rotate(20deg); opacity: 0.9; }
            100% { transform: scale(0.8) translateY(-45px) rotate(40deg); opacity: 0; }
        }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .main-app {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 16px;
            }
            .stage-box {
                height: 420px;
            }
            .chibi-avatar-wrapper {
                width: 280px;
                height: 380px;
            }
            .bottom-action-bar {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.9rem;
            }
            .top-tools {
                position: static;
                justify-content: center;
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Particles -->
    <div class="bg-sparkle" style="top: 10%; left: 8%; font-size: 2.2rem;">✨</div>
    <div class="bg-sparkle" style="top: 25%; right: 7%; font-size: 2.8rem; animation-delay: 1.2s;">🌸</div>
    <div class="bg-sparkle" style="top: 75%; left: 10%; font-size: 2rem; animation-delay: 2.4s;">💖</div>
    <div class="bg-sparkle" style="top: 85%; right: 12%; font-size: 2.4rem; animation-delay: 3s;">🎀</div>
    <div class="bg-sparkle" style="top: 50%; right: 4%; font-size: 1.8rem; animation-delay: 1.8s;">🧁</div>

    <!-- Quick Audio & Help Buttons -->
    <div class="top-tools">
        <button class="tool-btn" id="btn-sound" title="تشغيل / كتم المؤثرات الصوتية">🔊</button>
        <button class="tool-btn" id="btn-snap" title="لقطة سريعة">📸</button>
    </div>

    <!-- Header Section -->
    <header>
        <div class="title-wrapper">
            <h1>🎀 Pookie Chibi Deluxe 🎀</h1>
        </div>
        <div class="badge-celebration">
            <span>🎉</span>
            <span>احتفالاً بوصول 16,000 عضوة مبدعة في السيرفر!</span>
            <span>💖</span>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="main-app">

        <!-- Left Column: Character Stage -->
        <div class="stage-column">
            
            <!-- Stage Box (Background + Chibi Avatar) -->
            <div class="stage-box" id="stage-bg-card">
                
                <div class="chibi-avatar-wrapper" id="avatar-click-zone" title="اضغطي علي لدغدغتي وسماع صوت لطيف! ✨">
                    
                    <svg id="chibi-svg" width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="blushRadial" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#ff477e" stop-opacity="0.55"/>
                                <stop offset="60%" stop-color="#ff7aa2" stop-opacity="0.3"/>
                                <stop offset="100%" stop-color="#ff7aa2" stop-opacity="0"/>
                            </radialGradient>

                            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4a1525" flood-opacity="0.12"/>
                            </filter>
                        </defs>

                        <!-- 0. أجنحة / تأثيرات خلفية (Back Accessories) -->
                        <g id="slot-back-acc"></g>

                        <!-- 1. الشعر الخلفي (Back Hair) -->
                        <g id="slot-hair-back"></g>

                        <!-- 2. الحيوان الأليف / المرافق (Companion Pet) -->
                        <g id="slot-pet" class="anim-pet"></g>

                        <!-- 3. الجسم والجلد (Base Chibi Anatomy) -->
                        <g id="slot-body">
                            <!-- الرقبة -->
                            <rect id="node-skin-neck" x="189" y="215" width="22" height="26" rx="8" fill="#ffe2d6"/>
                            <!-- ظل أسفل الرأس على الرقبة -->
                            <ellipse cx="200" cy="223" rx="14" ry="4" fill="#000000" opacity="0.08"/>

                            <!-- الساقين والقدمين -->
                            <g id="slot-legs">
                                <rect id="node-skin-leg-l" x="172" y="295" width="23" height="74" rx="11" fill="#ffe2d6"/>
                                <rect id="node-skin-leg-r" x="205" y="295" width="23" height="74" rx="11" fill="#ffe2d6"/>
                            </g>

                            <!-- الجذع (Torso) -->
                            <path id="node-skin-torso" d="M 166 230 Q 200 226 234 230 L 230 305 Q 200 312 170 305 Z" fill="#ffe2d6"/>

                            <!-- الذراعين (Cute posing arms) -->
                            <g id="slot-arms-back">
                                <path id="node-skin-arm-l" d="M 168 234 C 145 248 135 275 145 292 C 152 288 160 262 174 246 Z" fill="#ffe2d6"/>
                                <path id="node-skin-arm-r" d="M 232 234 C 255 248 265 275 255 292 C 248 288 240 262 226 246 Z" fill="#ffe2d6"/>
                            </g>

                            <!-- الرأس الفاتن (Big Kawaii Chibi Head) -->
                            <g filter="url(#softShadow)">
                                <ellipse id="node-skin-head" cx="200" cy="150" rx="88" ry="78" fill="#ffe2d6"/>
                            </g>

                            <!-- الأذنين اللطيفتين -->
                            <ellipse id="node-skin-ear-l" cx="114" cy="156" rx="12" ry="14" fill="#ffe2d6"/>
                            <ellipse id="node-skin-ear-r" cx="286" cy="156" rx="12" ry="14" fill="#ffe2d6"/>
                            <ellipse cx="115" cy="156" rx="6" ry="8" fill="#ff8aa6" opacity="0.45"/>
                            <ellipse cx="285" cy="156" rx="6" ry="8" fill="#ff8aa6" opacity="0.45"/>

                            <!-- الخدود الوردية ولمعات الكاواي (Blush & Sparkles) -->
                            <g id="slot-blush">
                                <circle cx="150" cy="172" r="18" fill="url(#blushRadial)"/>

            constructor() {

            }
            init() {
                if (!this.ctx) {

                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(580, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(860, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch(e) {}
            }

                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);

                        <ellipse cx="12" cy="5" rx="5" ry="14" fill="#ffe5ec" stroke="#ffb3c6" stroke-width="1.5"/>
                        <ellipse cx="12" cy="5" rx="2.5" ry="9" fill="#ff70a6"/>
                        <ellipse cx="24" cy="5" rx="5" ry="14" fill="#ffe5ec" stroke="#ffb3c6" stroke-width="1.5"/>
                        <ellipse cx="24" cy="5" rx="2.5" ry="9" fill="#ff70a6"/>
                        <circle cx="13" cy="22" r="2" fill="#2b2d42"/>
                        <circle cx="23" cy="22" r="2" fill="#2b2d42"/>
                        <polygon points="17,26 19,26 18,28" fill="#ff477e"/>
                    </g>
                `;
            } else {
                pet.innerHTML = '';
            }
        }

        /* ============================================================
           Randomizer & Reset Engine
           ============================================================ */
        function randomizeCharacter() {
            state.hairStyle = Math.floor(Math.random() * DB.hairStyles.length);
            state.hairColor = DB.hairColors[Math.floor(Math.random() * DB.hairColors.length)].hex;
            state.eyeStyle = Math.floor(Math.random() * DB.eyeStyles.length);
            state.eyeColor = DB.eyeColors[Math.floor(Math.random() * DB.eyeColors.length)].hex;
            state.mouthStyle = Math.floor(Math.random() * DB.mouthStyles.length);
            state.outfit = Math.floor(Math.random() * DB.outfits.length);
            state.shoes = Math.floor(Math.random() * DB.shoes.length);
            state.headAcc = Math.floor(Math.random() * DB.headAccs.length);
            state.handheld = Math.floor(Math.random() * DB.handhelds.length);
            state.pet = Math.floor(Math.random() * DB.pets.length);
            state.bgStyle = Math.floor(Math.random() * DB.backgrounds.length);
            state.skinTone = DB.skins[Math.floor(Math.random() * DB.skins.length)].hex;

            sfx.sparkle();
            renderAllPanels();
            updateBackground();
            drawChibi();
            showToast("✨ تم إنشاء تنسيق عشوائي مدهش وساحر!");
        }

        function resetCharacter() {
            state.hairStyle = 0;
            state.hairColor = '#4a2835';
            state.eyeStyle = 0;
            state.eyeColor = '#7b2cbf';
            state.mouthStyle = 0;
            state.outfit = 0;
            state.shoes = 0;
            state.headAcc = 2; // 16K Crown
            state.handheld = 4; // 16K Balloon
            state.pet = 0;
            state.bgStyle = 3;
            state.skinTone = '#ffe2d6';

            sfx.pop();
            renderAllPanels();
            updateBackground();
            drawChibi();
            showToast("🔄 تم إعادة ضبط الشخصية للبراءة الأولى!");
        }

        /* ============================================================
           Toast Message Hub
           ============================================================ */
        let toastTimeout = null;
        function showToast(text, icon = "💖") {
            const toast = document.getElementById('toast-notice');
            const msg = document.getElementById('toast-msg');
            const ico = document.getElementById('toast-icon');
            if (!toast || !msg) return;

            msg.innerText = text;
            ico.innerText = icon;
            toast.classList.add('show');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /* ============================================================
           Interactive Poke / Click Feedback
           ============================================================ */
        function setupInteractiveCanvas() {
            const avatarZone = document.getElementById('avatar-click-zone');
            if (!avatarZone) return;

            avatarZone.addEventListener('click', (e) => {
                sfx.giggle();

                // Sparkle pop animation on cursor
                const spark = document.createElement('div');
                spark.className = 'sparkle-pop';
                const emojis = ['💖', '✨', '🌸', '🎀', '🧁', '⭐'];
                spark.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                spark.style.left = `${e.clientX - 15}px`;
                spark.style.top = `${e.clientY - 25}px`;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 750);
            });
        }

        /* ============================================================
           HD Canvas Snapshot & Export Engine
           ============================================================ */
        function exportImage(type = 'full') {
            sfx.snap();
            showToast("⏳ جاري تجهيز وتحميل تصميمك بأعلى جودة...", "📸");

            const svgEl = document.getElementById('chibi-svg');
            const svgXML = new XMLSerializer().serializeToString(svgEl);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const userName = document.getElementById('avatar-name-input').value.trim() || "Pookie Chibi";

            if (type === 'pfp') { // Square Profile Picture (Avatar)
                canvas.width = 600;
                canvas.height = 600;

                const grad = ctx.createLinearGradient(0, 0, 0, 600);
                grad.addColorStop(0, '#fff0f5');
                grad.addColorStop(1, '#ffd6e0');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 600, 600);

                ctx.beginPath();
                ctx.arc(300, 300, 280, 0, Math.PI * 2);
                ctx.strokeStyle = '#ff5d8f';
                ctx.lineWidth = 10;
                ctx.stroke();

                const img = new Image();
                const svgBlob = new Blob([svgXML], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                img.onload = () => {
                    ctx.drawImage(img, -70, -30, 740, 925);
                    URL.revokeObjectURL(url);
                    triggerDownload(canvas, `pookie-pfp-16k-${Date.now()}.png`);
                };
                img.src = url;

            } else { // Full Celebratory Card HD
                canvas.width = 800;
                canvas.height = 1050;

                const grad = ctx.createLinearGradient(0, 0, 0, 1050);
                grad.addColorStop(0, '#fff5f8');
                grad.addColorStop(0.4, '#ffe5ec');
                grad.addColorStop(1, '#ffd1dc');
                ctx.fillStyle = grad;
                if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(0, 0, 800, 1050, 40);
                    ctx.fill();
                } else {
                    ctx.fillRect(0, 0, 800, 1050);
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 18;
                ctx.stroke();

                ctx.fillStyle = '#ff5d8f';
                ctx.font = 'bold 36px "Fredoka", "Tajawal", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("🎀 POOKIE 16,000 CELEBRATION 🎀", 400, 75);

                ctx.fillStyle = '#7a3e5c';
                ctx.font = 'bold 22px "Tajawal", sans-serif';
                ctx.fillText("✨ احتفال وصول سيرفرنا لـ 16,000 عضوة مبدعة ✨", 400, 115);

                const img = new Image();
                const svgBlob = new Blob([svgXML], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                img.onload = () => {
                    ctx.drawImage(img, 60, 130, 680, 850);
                    URL.revokeObjectURL(url);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(150, 960, 500, 56, 28);
                    } else {
                        ctx.rect(150, 960, 500, 56);
                    }
                    ctx.fill();
                    ctx.strokeStyle = '#ffb3c6';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.fillStyle = '#ff3370';
                    ctx.font = '900 24px "Tajawal", "Fredoka", sans-serif';
                    ctx.fillText(userName, 400, 998);

                    triggerDownload(canvas, `pookie-chibi-16k-${Date.now()}.png`);
                };
                img.src = url;
            }
        }

        function triggerDownload(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("💖 تم تنزيل تصميمك بجهازك بنجاح! مبروك 16K!");
        }

        async function copyToClipboard() {
            sfx.pop();
            const svgEl = document.getElementById('chibi-svg');
            const svgXML = new XMLSerializer().serializeToString(svgEl);

            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 750;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 600, 750);

            const img = new Image();
            const svgBlob = new Blob([svgXML], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = async () => {
                ctx.drawImage(img, 0, 0, 600, 750);
                URL.revokeObjectURL(url);

                try {
                    canvas.toBlob(async (blob) => {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        showToast("📋 تم نسخ الصورة للحافظة! يمكنك لصقها بالديسكورد الآن (Ctrl+V)!");
                    });
                } catch(err) {
                    showToast("⚠️ الحافظة غير مدعومة مباشرة، جاري تنزيل الصورة بدلاً منها!");
                    triggerDownload(canvas, 'pookie-chibi.png');
                }
            };
            img.src = url;
        }

        /* ============================================================
           Application Bootstrapper
           ============================================================ */
        function startApp() {
            initTabs();
            renderAllPanels();
            updateBackground();
            drawChibi();
            setupInteractiveCanvas();

            const soundBtn = document.getElementById('btn-sound');
            if (soundBtn) {
                soundBtn.addEventListener('click', () => {
                    state.soundEnabled = !state.soundEnabled;
                    soundBtn.innerText = state.soundEnabled ? '🔊' : '🔇';
                    showToast(state.soundEnabled ? "تم تفعيل المؤثرات الصوتية 🎵" : "تم كتم الصوت 🔇");
                });
            }

            const snapBtn = document.getElementById('btn-snap');
            if (snapBtn) snapBtn.addEventListener('click', () => exportImage('full'));

            document.getElementById('btn-quick-rand').addEventListener('click', randomizeCharacter);
            document.getElementById('btn-quick-reset').addEventListener('click', resetCharacter);
            document.getElementById('btn-save-full').addEventListener('click', () => exportImage('full'));
            document.getElementById('btn-save-pfp').addEventListener('click', () => exportImage('pfp'));
            document.getElementById('btn-copy-png').addEventListener('click', copyToClipboard);

            document.getElementById('avatar-name-input').addEventListener('input', (e) => {
                state.name = e.target.value;
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
