<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 Pookie Chibi Dress Up 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffd6e0;
            background-image: radial-gradient(#ff9ebb 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            color: #4a2840;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            text-shadow: 2.5px 2.5px 0 #ff5d8f, -1px -1px 0 #ff5d8f, 1px -1px 0 #ff5d8f, -1px 1px 0 #ff5d8f;
        }

        .badge {
            background: #fff;
            color: #ff5d8f;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 4px;
            border: 2px dashed #ffb3c6;
            box-shadow: 0 4px 10px rgba(255, 93, 143, 0.2);
        }

        .main-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(255, 93, 143, 0.2);
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 860px;
            width: 100%;
            border: 4px solid #fff;
        }

        /* مسرح الشخصية */
        .stage {
            flex: 1;
            background: linear-gradient(180deg, #fff0f5 0%, #ffe3ea 100%);
            border-radius: 22px;
            border: 3px solid #ffcad4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            position: relative;
        }

        @keyframes chibiFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .chibi-box {
            position: relative;
            width: 250px;
            height: 340px;
            animation: chibiFloat 3.2s ease-in-out infinite;
        }

        .chibi-box svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @keyframes blinkAnime {
            0%, 94%, 100% { transform: scaleY(1); }
            96%, 98% { transform: scaleY(0.1); }
        }

        .eyes-group {
            transform-origin: 125px 95px;
            animation: blinkAnime 3.6s infinite;
        }

        /* لوحة التحكم والخيارات */
        .controls {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #fff;
            border: 2px solid #ffb3c6;
            color: #4a2840;
            padding: 7px 12px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .tab-btn.active {
            background: #ff5d8f !important;
            color: #fff !important;
            border-color: #ff5d8f !important;
        }

        /* محتويات التبويبات */
        .tab-panel {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            min-height: 220px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .tab-panel.active {
            display: grid !important;
        }

        .opt-btn {
            background: #fff;
            border: 2px solid #ffe5ec;
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s, border-color 0.15s;
        }

        .opt-btn:active {
            transform: scale(0.93);
        }

        .opt-btn.selected {
            border-color: #ff5d8f !important;
            background: #fff0f3 !important;
            box-shadow: 0 0 0 2px #ff5d8f;
        }

        .opt-btn .emoji {
            font-size: 1.8rem;
            line-height: 1;
        }

        .opt-btn .txt {
            font-size: 0.78rem;
            font-weight: 800;
        }

        .color-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .act-btn {
            flex: 1;
            padding: 12px;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .act-btn:active {
            transform: scale(0.95);
        }

        .btn-rand {
            background: #ffe5ec;
            color: #4a2840;
        }

        .btn-save {
            background: #ff5d8f;
            color: #fff;
            box-shadow: 0 5px 12px rgba(255, 93, 143, 0.35);
        }

        #toast {
            position: fixed;
            bottom: 25px;
            background: #321e28;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }

        #toast.show {
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .main-card {
                flex-direction: column;
            }
            .tab-panel {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎀 Pookie Chibi 🎀</h1>
        <div class="badge">🎉 احتفالاً بـ 16,000 عضوة 🎉</div>
    </header>

    <div class="main-card">
        <!-- منطقة الشخصية Chibi -->
        <div class="stage">
            <div class="chibi-box">
                <!-- شعر خلفي -->
                <svg id="svg-hair-back" viewBox="0 0 250 340"></svg>

                <!-- جسم الشخصية الأساسي -->
                <svg id="svg-base" viewBox="0 0 250 340">
                    <rect id="skin-neck" x="117" y="145" width="16" height="15" rx="5" fill="#ffdfd3"/>
                    <path id="skin-body" d="M 105 155 Q 125 153 145 155 L 142 200 Q 125 205 108 200 Z" fill="#ffdfd3"/>
                    <rect id="skin-leg1" x="108" y="195" width="14" height="42" rx="7" fill="#ffdfd3"/>
                    <rect id="skin-leg2" x="128" y="195" width="14" height="42" rx="7" fill="#ffdfd3"/>
                    <ellipse id="skin-arm1" cx="98" cy="175" rx="7" ry="18" transform="rotate(15 98 175)" fill="#ffdfd3"/>
                    <ellipse id="skin-arm2" cx="152" cy="175" rx="7" ry="18" transform="rotate(-15 152 175)" fill="#ffdfd3"/>

                    <!-- الرأس الكبير -->
                    <ellipse id="skin-head" cx="125" cy="95" rx="58" ry="52" fill="#ffdfd3"/>

                    <!-- الخدود الوردية -->
                    <ellipse cx="94" cy="110" rx="9" ry="5.5" fill="#ff8aa6" opacity="0.65"/>
                    <ellipse cx="156" cy="110" rx="9" ry="5.5" fill="#ff8aa6" opacity="0.65"/>

                    <!-- العيون الكبيرة مع الرمش التلقائي -->
                    <g class="eyes-group">
                        <ellipse cx="100" cy="96" rx="12" ry="15" fill="#321e28"/>
                        <ellipse cx="100" cy="101" rx="8" ry="8" fill="#7a3e65"/>
                        <circle cx="96" cy="90" r="4.5" fill="#ffffff"/>
                        <circle cx="104" cy="102" r="2.2" fill="#ffffff"/>
                        <path d="M 87 86 Q 98 80 110 86" stroke="#321e28" stroke-width="2.5" fill="none" stroke-linecap="round"/>

                        <ellipse cx="150" cy="96" rx="12" ry="15" fill="#321e28"/>
                        <ellipse cx="150" cy="101" rx="8" ry="8" fill="#7a3e65"/>
                        <circle cx="146" cy="90" r="4.5" fill="#ffffff"/>
                        <circle cx="154" cy="102" r="2.2" fill="#ffffff"/>
                        <path d="M 140 86 Q 152 80 163 86" stroke="#321e28" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    </g>

                    <!-- فم ابتسامة لطيف -->
                    <path d="M 121 118 Q 125 123 129 118" stroke="#e76f51" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>

                <!-- لبس -->
                <svg id="svg-outfit" viewBox="0 0 250 340"></svg>
                <!-- شعر أمامي -->
                <svg id="svg-hair-front" viewBox="0 0 250 340"></svg>
                <!-- إكسسوار -->
                <svg id="svg-acc" viewBox="0 0 250 340"></svg>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div class="controls">
            <!-- أزرار التبويبات -->
            <div class="tab-bar">
                <button type="button" class="tab-btn active" onclick="switchCategory('panel-hair', this)">💇‍♀️ التسريحة</button>
                <button type="button" class="tab-btn" onclick="switchCategory('panel-hcolor', this)">🎨 لون الشعر</button>
                <button type="button" class="tab-btn" onclick="switchCategory('panel-outfit', this)">👗 اللبس</button>
                <button type="button" class="tab-btn" onclick="switchCategory('panel-acc', this)">✨ إكسسوار</button>
                <button type="button" class="tab-btn" onclick="switchCategory('panel-skin', this)">🌸 البشرة</button>
            </div>

            <!-- قائمة تسريحات الشعر -->
            <div id="panel-hair" class="tab-panel active">
                <div class="opt-btn selected" onclick="pickHair(0, this)"><span class="emoji">👧</span><span class="txt">توين تيل</span></div>
                <div class="opt-btn" onclick="pickHair(1, this)"><span class="emoji">👱‍♀️</span><span class="txt">كعكتين</span></div>
                <div class="opt-btn" onclick="pickHair(2, this)"><span class="emoji">👩</span><span class="txt">شعر ناعم</span></div>
                <div class="opt-btn" onclick="pickHair(3, this)"><span class="emoji">💇‍♀️</span><span class="txt">بوب قصير</span></div>
            </div>

            <!-- قائمة ألوان الشعر -->
            <div id="panel-hcolor" class="tab-panel">
                <div class="opt-btn selected" onclick="pickHairColor('#49281a', this)"><span class="color-circle" style="background:#49281a"></span><span class="txt">شوكولا</span></div>
                <div class="opt-btn" onclick="pickHairColor('#1a181b', this)"><span class="color-circle" style="background:#1a181b"></span><span class="txt">أسود</span></div>
                <div class="opt-btn" onclick="pickHairColor('#ff758f', this)"><span class="color-circle" style="background:#ff758f"></span><span class="txt">بيبي بينك</span></div>
                <div class="opt-btn" onclick="pickHairColor('#c77dff', this)"><span class="color-circle" style="background:#c77dff"></span><span class="txt">لافندر</span></div>
                <div class="opt-btn" onclick="pickHairColor('#ffb703', this)"><span class="color-circle" style="background:#ffb703"></span><span class="txt">أشقر</span></div>
                <div class="opt-btn" onclick="pickHairColor('#e07a5f', this)"><span class="color-circle" style="background:#e07a5f"></span><span class="txt">كراميل</span></div>
            </div>

            <!-- قائمة الملابس -->
            <div id="panel-outfit" class="tab-panel">
                <div class="opt-btn selected" onclick="pickOutfit(0, this)"><span class="emoji">🎀</span><span class="txt">فستان وردي</span></div>
                <div class="opt-btn" onclick="pickOutfit(1, this)"><span class="emoji">🎒</span><span class="txt">مريول كحلي</span></div>
                <div class="opt-btn" onclick="pickOutfit(2, this)"><span class="emoji">👚</span><span class="txt">هودي موف</span></div>
                <div class="opt-btn" onclick="pickOutfit(3, this)"><span class="emoji">👗</span><span class="txt">فستان لوليتا</span></div>
            </div>

            <!-- قائمة الإكسسوارات -->
            <div id="panel-acc" class="tab-panel">
                <div class="opt-btn selected" onclick="pickAcc(0, this)"><span class="emoji">🎀</span><span class="txt">فيونكة</span></div>
                <div class="opt-btn" onclick="pickAcc(1, this)"><span class="emoji">👑</span><span class="txt">تاج 16K</span></div>
                <div class="opt-btn" onclick="pickAcc(2, this)"><span class="emoji">⭐</span><span class="txt">نجوم</span></div>
                <div class="opt-btn" onclick="pickAcc(3, this)"><span class="emoji">👓</span><span class="txt">نظارة وردية</span></div>
                <div class="opt-btn" onclick="pickAcc(4, this)"><span class="emoji">❌</span><span class="txt">بدون</span></div>
            </div>

            <!-- قائمة ألوان البشرة -->
            <div id="panel-skin" class="tab-panel">
                <div class="opt-btn selected" onclick="pickSkin('#ffdfd3', this)"><span class="color-circle" style="background:#ffdfd3"></span><span class="txt">فاتح كلاسيك</span></div>
                <div class="opt-btn" onclick="pickSkin('#fcd5b8', this)"><span class="color-circle" style="background:#fcd5b8"></span><span class="txt">خوخي دافئ</span></div>
                <div class="opt-btn" onclick="pickSkin('#dca074', this)"><span class="color-circle" style="background:#dca074"></span><span class="txt">حنطي تان</span></div>
                <div class="opt-btn" onclick="pickSkin('#8a5836', this)"><span class="color-circle" style="background:#8a5836"></span><span class="txt">برونزي غني</span></div>
            </div>

            <!-- الأزرار السفلية -->
            <div class="action-bar">
                <button type="button" class="act-btn btn-rand" onclick="randomChibi()">🎲 عشوائي</button>
                <button type="button" class="act-btn btn-save" onclick="downloadChibi()">💾 تنزيل بجهازي</button>
            </div>
        </div>
    </div>

    <div id="toast">تم حفظ وتنزيل شخصيتك بنجاح! 💖</div>

    <script>
        const state = {
            hair: 0,
            hairColor: '#49281a',
            outfit: 0,
            acc: 0,
            skin: '#ffdfd3'
        };

        // التبديل الصريح بين التبويبات
        function switchCategory(panelId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(panelId).classList.add('active');
        }

        function markSelected(el) {
            if (!el) return;
            const parent = el.parentElement;
            parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function pickHair(id, el) {
            state.hair = id;
            markSelected(el);
            renderChibi();
        }

        function pickHairColor(col, el) {
            state.hairColor = col;
            markSelected(el);
            renderChibi();
        }

        function pickOutfit(id, el) {
            state.outfit = id;
            markSelected(el);
            renderChibi();
        }

        function pickAcc(id, el) {
            state.acc = id;
            markSelected(el);
            renderChibi();
        }

        function pickSkin(col, el) {
            state.skin = col;
            markSelected(el);
            renderChibi();
        }

        function renderChibi() {
            // تحديث لون البشرة
            ['skin-neck', 'skin-body', 'skin-leg1', 'skin-leg2', 'skin-arm1', 'skin-arm2', 'skin-head'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('fill', state.skin);
            });

            const hb = document.getElementById('svg-hair-back');
            const hf = document.getElementById('svg-hair-front');
            const out = document.getElementById('svg-outfit');
            const acc = document.getElementById('svg-acc');
            const c = state.hairColor;

            // الشعر
            if (state.hair === 0) { // توين تيل
                hb.innerHTML = `
                    <path d="M 65 95 C 30 110 20 180 45 220 C 55 180 65 140 75 115 Z" fill="${c}"/>
                    <path d="M 185 95 C 220 110 230 180 205 220 C 195 180 185 140 175 115 Z" fill="${c}"/>
                `;
                hf.innerHTML = `
                    <path d="M 68 85 Q 125 45 182 85 C 185 100 175 110 160 95 C 145 115 135 90 125 90 C 115 90 105 115 90 95 C 75 110 65 100 68 85 Z" fill="${c}"/>
                    <ellipse cx="66" cy="100" rx="5" ry="7" fill="#ff758f"/>
                    <ellipse cx="184" cy="100" rx="5" ry="7" fill="#ff758f"/>
                `;
            } else if (state.hair === 1) { // كعكتين
                hb.innerHTML = `
                    <circle cx="62" cy="62" r="22" fill="${c}"/>
                    <circle cx="188" cy="62" r="22" fill="${c}"/>
                `;
                hf.innerHTML = `
                    <path d="M 70 85 Q 125 50 180 85 C 175 105 155 95 140 92 Q 125 105 110 92 C 95 95 75 105 70 85 Z" fill="${c}"/>
                `;
            } else if (state.hair === 2) { // طويل ناعم
                hb.innerHTML = `
                    <path d="M 60 90 C 40 160 50 240 75 270 L 175 270 C 200 240 210 160 190 90 Z" fill="${c}"/>
                `;
                hf.innerHTML = `
                    <path d="M 68 85 Q 125 46 182 85 C 180 120 168 125 160 100 C 140 102 135 92 125 92 C 115 92 110 102 90 100 C 82 125 70 120 68 85 Z" fill="${c}"/>
                `;
            } else { // بوب
                hb.innerHTML = <ellipse cx="125" cy="105" rx="66" ry="60" fill="${c}"/>;
                hf.innerHTML = `
                    <path d="M 65 90 Q 125 48 185 90 C 188 125 178 140 165 110 C 145 105 135 90 125 90 C 115 90 105 105 85 110 C 72 140 62 125 65 90 Z" fill="${c}"/>
                `;
            }

            // اللبس
            if (state.outfit === 0) { // فستان وردي
                out.innerHTML = `
                    <path d="M 104 155 L 146 155 L 158 210 L 92 210 Z" fill="#ff758f"/>
                    <path d="M 92 210 Q 125 224 158 210 L 164 220 Q 125 235 86 220 Z" fill="#ff4d6d"/>
                    <circle cx="125" cy="168" r="3.5" fill="#fff"/>
                    <circle cx="125" cy="180" r="3.5" fill="#fff"/>
                    <circle cx="98" cy="160" r="9" fill="#ffb3c6"/>
                    <circle cx="152" cy="160" r="9" fill="#ffb3c6"/>
                `;
            } else if (state.outfit === 1) { // مدرسي
                out.innerHTML = `
                    <path d="M 105 155 L 145 155 L 148 180 L 102 180 Z" fill="#ffffff"/>
                    <polygon points="120,160 130,160 125,173" fill="#e63946"/>
                    <polygon points="100,180 150,180 162,220 88,220" fill="#1d3557"/>
                `;
            } else if (state.outfit === 2) { // هودي
                out.innerHTML = `
                    <path d="M 95 153 Q 125 147 155 153 L 152 213 Q 125 219 98 213 Z" fill="#c77dff"/>
                    <circle cx="125" cy="180" r="7" fill="#ffc6ff"/>
                    <rect x="90" y="160" width="14" height="34" rx="7" transform="rotate(18 90 160)" fill="#c77dff"/>
                    <rect x="146" y="160" width="14" height="34" rx="7" transform="rotate(-18 146 160)" fill="#c77dff"/>
                `;
            } else { // لوليتا
                out.innerHTML = `
                    <path d="M 106 155 L 144 155 L 150 185 L 100 185 Z" fill="#ffeaa7"/>
                    <path d="M 96 185 L 154 185 L 168 225 L 82 225 Z" fill="#fab1a0"/>
                    <circle cx="125" cy="200" r="5" fill="#ff7675"/>
                `;
            }

            // الإكسسوارات
            if (state.acc === 0) { // فيونكة
                acc.innerHTML = `
                    <g transform="translate(125, 47)">
                        <path d="M 0 0 C -25 -22 -35 15 -5 5 Z" fill="#ff4d6d"/>
                        <path d="M 0 0 C 25 -22 35 15 5 5 Z" fill="#ff4d6d"/>
                        <circle cx="0" cy="2" r="5" fill="#ffe5ec"/>
                    </g>
                `;
            } else if (state.acc === 1) { // تاج
                acc.innerHTML = `
                    <polygon points="105,47 112,27 125,39 138,27 145,47" fill="#ffd166" stroke="#f39c12" stroke-width="2"/>
                    <circle cx="125" cy="37" r="3" fill="#e63946"/>
                    <text x="125" y="46" font-size="8" font-weight="900" fill="#d35400" text-anchor="middle">16K</text>
                `;
            } else if (state.acc === 2) { // نجوم
                acc.innerHTML = `
                    <text x="75" y="75" font-size="20">⭐</text>
                    <text x="160" y="75" font-size="20">⭐</text>
                `;
            } else if (state.acc === 3) { // نظارة
                acc.innerHTML = `
                    <circle cx="100" cy="96" r="17" stroke="#ff4d6d" stroke-width="3" fill="rgba(255,255,255,0.2)"/>
                    <circle cx="150" cy="96" r="17" stroke="#ff4d6d" stroke-width="3" fill="rgba(255,255,255,0.2)"/>
                    <line x1="117" y1="96" x2="133" y2="96" stroke="#ff4d6d" stroke-width="3"/>
                `;
            } else {
                acc.innerHTML = '';
            }
        }

        // اختيار عشوائي
        function randomChibi() {
            state.hair = Math.floor(Math.random() * 4);
            const colors = ['#49281a', '#1a181b', '#ff758f', '#c77dff', '#ffb703', '#e07a5f'];
            state.hairColor = colors[Math.floor(Math.random() * colors.length)];
            state.outfit = Math.floor(Math.random() * 4);
            state.acc = Math.floor(Math.random() * 5);
            const skins = ['#ffdfd3', '#fcd5b8', '#dca074', '#8a5836'];
            state.skin = skins[Math.floor(Math.random() * skins.length)];
            renderChibi();
        }

        // تنزيل الصورة
        function downloadChibi() {
            const svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="500" height="680" viewBox="0 0 250 340">
                    <defs>
                        <linearGradient id="bgG" x1="0%" y1="0%" x2="0%" y2="1">
                            <stop offset="0%" stop-color="#fff0f5"/>
                            <stop offset="100%" stop-color="#ffd6e0"/>
                        </linearGradient>
                    </defs>
                    <rect width="250" height="340" rx="25" fill="url(#bgG)"/>
                    <text x="125" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ff5d8f" text-anchor="middle">🎀 Pookie 16K Celebration 🎀</text>
                    ${document.getElementById('svg-hair-back').innerHTML}
                    ${document.getElementById('svg-base').innerHTML}
                    ${document.getElementById('svg-outfit').innerHTML}
                    ${document.getElementById('svg-hair-front').innerHTML}
                    ${document.getElementById('svg-acc').innerHTML}
                </svg>
            `;

            const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 500;
                canvas.height = 680;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);

                const link = document.createElement('a');
                link.download = 'pookie-chibi-16k.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            };
            img.src = url;
        }

        // تشغيل أولي فوري عند الفتح
        renderChibi();
    </script>
</body>
</html>
