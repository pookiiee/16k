<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookie Animated Chibi ✨ 16K</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffd6e0;
            --soft-pink: #ffb3c6;
            --dark-pink: #ff5d8f;
            --accent-pink: #ff477e;
            --text-dark: #4a2840;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Tajawal', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--baby-pink);
            background-image: 
                radial-gradient(#ff9ebb 1.5px, transparent 1.5px),
                radial-gradient(#ffffff 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.1rem;
            color: #fff;
            text-shadow: 
                3px 3px 0px var(--dark-pink),
                -1px -1px 0 var(--dark-pink),  
                1px -1px 0 var(--dark-pink),
                -1px 1px 0 var(--dark-pink),
                1px 1px 0 var(--dark-pink);
        }

        .celebration-pill {
            display: inline-block;
            background: #fff;
            color: var(--dark-pink);
            font-weight: 800;
            font-size: 0.9rem;
            padding: 5px 16px;
            border-radius: 20px;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(255, 93, 143, 0.25);
            border: 2px dashed var(--soft-pink);
        }

        .game-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 45px rgba(255, 93, 143, 0.18);
            display: flex;
            gap: 25px;
            max-width: 920px;
            width: 100%;
            border: 5px solid #fff;
        }

        /* مسرح الشخصية */
        .stage-card {
            flex: 1;
            background: linear-gradient(180deg, #fff2f6 0%, #ffe0e9 100%);
            border-radius: 26px;
            border: 3px solid #ffcad4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 440px;
            position: relative;
            overflow: hidden;
        }

        /* حركة التنفس والطفو الطبيعية للشخصية (Idle animation) */
        @keyframes gentleBounce {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-7px) scale(1.008);
            }
        }

        .doll-canvas {
            position: relative;
            width: 250px;
            height: 360px;
            animation: gentleBounce 3.2s ease-in-out infinite;
            transition: transform 0.2s ease-out;
        }

        .doll-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* أنيميشن الغمز والرمش */
        @keyframes blinkEyes {
            0%, 94%, 100% {
                transform: scaleY(1);
            }
            96%, 98% {
                transform: scaleY(0.08);
            }
        }

        .chibi-eye-group {
            transform-origin: 125px 105px;
            animation: blinkEyes 3.8s infinite;
        }

        /* لوحة التحكم */
        .editor-card {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tab-button {
            background: #fff;
            border: 2px solid var(--soft-pink);
            color: var(--text-dark);
            padding: 7px 13px;
            border-radius: 16px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .tab-button.active, .tab-button:hover {
            background: var(--dark-pink);
            color: #fff;
            border-color: var(--dark-pink);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 93, 143, 0.35);
        }

        .items-viewport {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 290px;
            overflow-y: auto;
            padding: 6px;
        }

        .items-viewport::-webkit-scrollbar {
            width: 6px;
        }
        .items-viewport::-webkit-scrollbar-thumb {
            background: var(--soft-pink);
            border-radius: 10px;
        }

        .choice-btn {
            background: #fff;
            border: 2.5px solid #ffe5ec;
            border-radius: 18px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease-in-out;
            outline: none;
        }

        .choice-btn:hover {
            transform: scale(1.04);
            border-color: var(--soft-pink);
            background: #fffafa;
        }

        .choice-btn.selected {
            border-color: var(--dark-pink);
            background: #fff0f3;
            box-shadow: 0 0 0 2px var(--dark-pink);
        }

        .choice-btn span.emoji {
            font-size: 1.8rem;
            line-height: 1;
        }

        .choice-btn span.label {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2.5px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: inline-block;
        }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-random {
            background: #ffe5ec;
            color: var(--text-dark);
        }

        .btn-random:hover {
            background: #ffd0dc;
        }

        .btn-download {
            background: var(--dark-pink);
            color: #fff;
            box-shadow: 0 6px 15px rgba(255, 93, 143, 0.4);
        }

        .btn-download:hover {
            background: var(--accent-pink);
        }

        #toast {
            position: fixed;
            bottom: 20px;
            background: #321e28;
            color: #fff;
            padding: 9px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        #toast.show {
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .game-box {
                flex-direction: column;
            }
            .items-viewport {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎀 Pookie Animated Chibi 🎀</h1>
        <div class="celebration-pill">💖 احتفالاً بـ 16,000 عضوة في السيرفر 💖</div>
    </header>

    <div class="game-box">
        <!-- مسرح الشبيهة Chibi -->
        <div class="stage-card" id="stage-card">
            <div class="doll-canvas" id="doll-canvas">
                <!-- خلفية الشعر -->
                <svg id="svg-hair-back" class="doll-layer" viewBox="0 0 250 360"></svg>

                <!-- الجسم بستايل Chibi -->
                <svg id="svg-body" class="doll-layer" viewBox="0 0 250 360">
                    <rect id="skin-neck" x="117" y="150" width="16" height="15" rx="5" fill="#ffdfd3"/>
                    <path id="skin-torso" d="M 105 160 Q 125 158 145 160 L 142 205 Q 125 210 108 205 Z" fill="#ffdfd3"/>
                    <rect id="skin-leg-l" x="108" y="200" width="14" height="42" rx="7" fill="#ffdfd3"/>
                    <rect id="skin-leg-r" x="128" y="200" width="14" height="42" rx="7" fill="#ffdfd3"/>
                    <ellipse id="skin-arm-l" cx="98" cy="180" rx="7" ry="18" transform="rotate(15 98 180)" fill="#ffdfd3"/>
                    <ellipse id="skin-arm-r" cx="152" cy="180" rx="7" ry="18" transform="rotate(-15 152 180)" fill="#ffdfd3"/>

                    <!-- الرأس الضخم اللطيف -->
                    <ellipse id="skin-head" cx="125" cy="100" rx="58" ry="52" fill="#ffdfd3"/>

                    <!-- الخدود الوردية -->
                    <ellipse cx="94" cy="115" rx="9" ry="5.5" fill="#ff8aa6" opacity="0.65"/>
                    <ellipse cx="156" cy="115" rx="9" ry="5.5" fill="#ff8aa6" opacity="0.65"/>

                    <!-- مجموعة العيون مع أنيميشن الغمز والرمش التلقائي -->
                    <g class="chibi-eye-group">
                        <!-- العين اليسرى -->
                        <ellipse cx="100" cy="102" rx="12" ry="16" fill="#321e28"/>
                        <ellipse cx="100" cy="107" rx="9" ry="9" fill="#7a3e65"/>
                        <circle cx="96" cy="95" r="5" fill="#ffffff"/>
                        <circle cx="104" cy="108" r="2.5" fill="#ffffff"/>
                        <path d="M 86 90 Q 98 84 112 91" stroke="#321e28" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <path d="M 85 91 L 81 87" stroke="#321e28" stroke-width="2.5" stroke-linecap="round"/>

                        <!-- العين اليمنى -->
                        <ellipse cx="150" cy="102" rx="12" ry="16" fill="#321e28"/>
                        <ellipse cx="150" cy="107" rx="9" ry="9" fill="#7a3e65"/>
                        <circle cx="146" cy="95" r="5" fill="#ffffff"/>
                        <circle cx="154" cy="108" r="2.5" fill="#ffffff"/>
                        <path d="M 138 91 Q 152 84 164 90" stroke="#321e28" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <path d="M 165 91 L 169 87" stroke="#321e28" stroke-width="2.5" stroke-linecap="round"/>
                    </g>

                    <!-- الابتسامة -->
                    <path d="M 121 122 Q 125 127 129 122" stroke="#e76f51" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>

                <!-- طبقة الملابس -->
                <svg id="svg-outfit" class="doll-layer" viewBox="0 0 250 360"></svg>

                <!-- طبقة الشعر الأمامي -->
                <svg id="svg-hair-front" class="doll-layer" viewBox="0 0 250 360"></svg>

                <!-- طبقة الإكسسوارات -->
                <svg id="svg-acc" class="doll-layer" viewBox="0 0 250 360"></svg>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div class="editor-card">
            <div>
                <div class="nav-tabs">
                    <button class="tab-button active" data-tab="hair">💇‍♀️ التسريحة</button>
                    <button class="tab-button" data-tab="hairColor">🎨 لون الشعر</button>
                    <button class="tab-button" data-tab="outfit">👗 اللبس</button>
                    <button class="tab-button" data-tab="acc">✨ إكسسوار</button>
                    <button class="tab-button" data-tab="skin">🌸 البشرة</button>
                </div>

                <div class="items-viewport" id="options-grid"></div>
            </div>

            <div class="bottom-actions">
                <button class="btn-action btn-random" id="btn-random">🎲 عشوائي</button>
                <button class="btn-action btn-download" id="btn-save">💾 حفظ وتنزيل بجهازي</button>
            </div>
        </div>
    </div>

    <div id="toast">تم تحميل شخصيتك بنجاح! 💖</div>

    <script>
        const STORAGE_KEY = "pookie_chibi_saved_state_16k";

        const dataHairStyles = [
            { id: 0, name: "قرنين توين تيل", icon: "👧" },
            { id: 1, name: "كعكتين كيوت", icon: "👱‍♀️" },
            { id: 2, name: "شعر طويل ناعم", icon: "👩" },
            { id: 3, name: "بوب كيرلي قصير", icon: "💇‍♀️" }
        ];

        const dataHairColors = [
            { color: '#49281a', name: 'بني شوكولا' },
            { color: '#1a181b', name: 'أسود ليلي' },
            { color: '#ff758f', name: 'بيبي بينك' },
            { color: '#b5838d', name: 'موف باستيل' },
            { color: '#ffb703', name: 'أشقر عسلي' },
            { color: '#e07a5f', name: 'جينجر دافئ' }
        ];

        const dataOutfits = [
            { id: 0, name: "فستان Pookie الوردي", icon: "🎀" },
            { id: 1, name: "مريول مدرسي كاواي", icon: "🎒" },
            { id: 2, name: "هودي أوفر سايز بنفسجي", icon: "✨" },
            { id: 3, name: "فستان لوليتا باستيل", icon: "👗" }
        ];

        const dataAccessories = [
            { id: 0, name: "فيونكة وردية ضخمة", icon: "🎀" },
            { id: 1, name: "تاج ذهبي 16K", icon: "👑" },
            { id: 2, name: "دبابيس نجوم كيوت", icon: "⭐" },
            { id: 3, name: "نظارة أنمي وردية", icon: "👓" },
            { id: 4, name: "بدون إكسسوار", icon: "❌" }
        ];

        const dataSkins = [
            { color: "#ffdfd3", name: "فاتح كلاسيك" },
            { color: "#fcd5b8", name: "خوخي طبيعي" },
            { color: "#dca074", name: "حنطي تان" },
            { color: "#8a5836", name: "برونزي عميق" }
        ];

        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return {
                hairStyle: 0,
                hairColor: '#49281a',
                outfit: 0,
                accessory: 0,
                skin: '#ffdfd3'
            };
        }

        const appState = loadSavedState();

        function persistState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {}
        }

        let currentActiveTab = 'hair';

        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentActiveTab = btn.getAttribute('data-tab');
                renderOptions();
            });
        });

        function renderOptions() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            if (currentActiveTab === 'hair') {
                dataHairStyles.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = choice-btn ${appState.hairStyle === item.id ? 'selected' : ''};
                    btn.innerHTML = <span class="emoji">${item.icon}</span><span class="label">${item.name}</span>;
                    btn.onclick = () => {
                        appState.hairStyle = item.id;
                        persistState();
                        updateChibi();
                        renderOptions();
                    };
                    grid.appendChild(btn);
                });
            } else if (currentActiveTab === 'hairColor') {
                dataHairColors.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = choice-btn ${appState.hairColor === item.color ? 'selected' : ''};
                    btn.innerHTML = <span class="color-dot" style="background:${item.color};"></span><span class="label">${item.name}</span>;
                    btn.onclick = () => {
                        appState.hairColor = item.color;
                        persistState();
                        updateChibi();
                        renderOptions();
                    };
                    grid.appendChild(btn);
                });
            } else if (currentActiveTab === 'outfit') {
                dataOutfits.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = choice-btn ${appState.outfit === item.id ? 'selected' : ''};
                    btn.innerHTML = <span class="emoji">${item.icon}</span><span class="label">${item.name}</span>;
                    btn.onclick = () => {
                        appState.outfit = item.id;
                        persistState();
                        updateChibi();
                        renderOptions();
                    };
                    grid.appendChild(btn);
                });
            } else if (currentActiveTab === 'acc') {
                dataAccessories.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = choice-btn ${appState.accessory === item.id ? 'selected' : ''};
                    btn.innerHTML = <span class="emoji">${item.icon}</span><span class="label">${item.name}</span>;
                    btn.onclick = () => {
                        appState.accessory = item.id;
                        persistState();
                        updateChibi();
                        renderOptions();
                    };
                    grid.appendChild(btn);
                });
            } else if (currentActiveTab === 'skin') {
                dataSkins.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = choice-btn ${appState.skin === item.color ? 'selected' : ''};
                    btn.innerHTML = <span class="color-dot" style="background:${item.color};"></span><span class="label">${item.name}</span>;
                    btn.onclick = () => {
                        appState.skin = item.color;
                        persistState();
                        updateChibi();
                        renderOptions();
                    };
                    grid.appendChild(btn);
                });
            }
        }

        function updateChibi() {
            ['skin-neck', 'skin-torso', 'skin-leg-l', 'skin-leg-r', 'skin-arm-l', 'skin-arm-r', 'skin-head'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('fill', appState.skin);
            });

            const hairBack = document.getElementById('svg-hair-back');
            const hairFront = document.getElementById('svg-hair-front');
            hairBack.innerHTML = '';
            hairFront.innerHTML = '';

            const c = appState.hairColor;

            if (appState.hairStyle === 0) { // توين تيل
                hairBack.innerHTML = `
                    <path d="M 65 95 C 30 110 20 180 45 220 C 55 180 65 140 75 115 Z" fill="${c}"/>
                    <path d="M 185 95 C 220 110 230 180 205 220 C 195 180 185 140 175 115 Z" fill="${c}"/>
                `;
                hairFront.innerHTML = `
                    <path d="M 68 85 Q 125 45 182 85 C 185 100 175 110 160 95 C 145 115 135 90 125 90 C 115 90 105 115 90 95 C 75 110 65 100 68 85 Z" fill="${c}"/>
                    <ellipse cx="66" cy="100" rx="5" ry="7" fill="#ff758f"/>
                    <ellipse cx="184" cy="100" rx="5" ry="7" fill="#ff758f"/>
                `;
            } else if (appState.hairStyle === 1) { // كعكتين
                hairBack.innerHTML = `
                    <circle cx="62" cy="62" r="22" fill="${c}"/>
                    <circle cx="188" cy="62" r="22" fill="${c}"/>
                `;
                hairFront.innerHTML = `
                    <path d="M 70 85 Q 125 50 180 85 C 175 105 155 95 140 92 Q 125 105 110 92 C 95 95 75 105 70 85 Z" fill="${c}"/>
                `;
            } else if (appState.hairStyle === 2) { // شعر طويل ناعم
                hairBack.innerHTML = `
                    <path d="M 60 90 C 40 160 50 240 75 270 L 175 270 C 200 240 210 160 190 90 Z" fill="${c}"/>
                `;
                hairFront.innerHTML = `
                    <path d="M 68 85 Q 125 46 182 85 C 180 120 168 125 160 100 C 140 102 135 92 125 92 C 115 92 110 102 90 100 C 82 125 70 120 68 85 Z" fill="${c}"/>
                `;
            } else if (appState.hairStyle === 3) { // بوب قصير
                hairBack.innerHTML = `
                    <ellipse cx="125" cy="110" rx="66" ry="60" fill="${c}"/>
                `;
                hairFront.innerHTML = `
                    <path d="M 65 90 Q 125 48 185 90 C 188 125 178 140 165 110 C 145 105 135 90 125 90 C 115 90 105 105 85 110 C 72 140 62 125 65 90 Z" fill="${c}"/>
                `;
            }

            const outfitSvg = document.getElementById('svg-outfit');
            outfitSvg.innerHTML = '';

            if (appState.outfit === 0) { // فستان وردي
                outfitSvg.innerHTML = `
                    <path d="M 104 160 L 146 160 L 158 215 L 92 215 Z" fill="#ff758f"/>
                    <path d="M 92 215 Q 125 228 158 215 L 164 225 Q 125 240 86 225 Z" fill="#ff4d6d"/>
                    <circle cx="125" cy="172" r="3.5" fill="#fff"/>
                    <circle cx="125" cy="184" r="3.5" fill="#fff"/>
                    <circle cx="98" cy="165" r="9" fill="#ffb3c6"/>
                    <circle cx="152" cy="165" r="9" fill="#ffb3c6"/>
                `;
            } else if (appState.outfit === 1) { // مريول مدرسي
                outfitSvg.innerHTML = `
                    <path d="M 105 160 L 145 160 L 148 185 L 102 185 Z" fill="#ffffff"/>
                    <polygon points="120,165 130,165 125,178" fill="#e63946"/>
                    <polygon points="100,185 150,185 162,225 88,225" fill="#1d3557"/>
                `;
            } else if (appState.outfit === 2) { // هودي باستيل
                outfitSvg.innerHTML = `
                    <path d="M 95 158 Q 125 152 155 158 L 152 218 Q 125 224 98 218 Z" fill="#c77dff"/>
                    <circle cx="125" cy="185" r="7" fill="#ffc6ff"/>
                    <rect x="90" y="165" width="14" height="34" rx="7" transform="rotate(18 90 165)" fill="#c77dff"/>
                    <rect x="146" y="165" width="14" height="34" rx="7" transform="rotate(-18 146 165)" fill="#c77dff"/>
                `;
            } else if (appState.outfit === 3) { // فستان لوليتا
                outfitSvg.innerHTML = `
                    <path d="M 106 160 L 144 160 L 150 190 L 100 190 Z" fill="#ffeaa7"/>
                    <path d="M 96 190 L 154 190 L 168 230 L 82 230 Z" fill="#fab1a0"/>
                    <circle cx="125" cy="205" r="5" fill="#ff7675"/>
                `;
            }

            const accSvg = document.getElementById('svg-acc');
            accSvg.innerHTML = '';

            if (appState.accessory === 0) { // فيونكة
                accSvg.innerHTML = `
                    <g transform="translate(125, 52)">
                        <path d="M 0 0 C -25 -22 -35 15 -5 5 Z" fill="#ff4d6d"/>
                        <path d="M 0 0 C 25 -22 35 15 5 5 Z" fill="#ff4d6d"/>
                        <circle cx="0" cy="2" r="5" fill="#ffe5ec"/>
                    </g>
                `;
            } else if (appState.accessory === 1) { // تاج
                accSvg.innerHTML = `
                    <polygon points="105,52 112,32 125,44 138,32 145,52" fill="#ffd166" stroke="#f39c12" stroke-width="2"/>
                    <circle cx="125" cy="42" r="3" fill="#e63946"/>
                    <text x="125" y="51" font-size="8" font-weight="900" fill="#d35400" text-anchor="middle">16K</text>
                `;
            } else if (appState.accessory === 2) { // نجوم
                accSvg.innerHTML = `
                    <text x="75" y="80" font-size="20">⭐</text>
                    <text x="160" y="80" font-size="20">⭐</text>
                `;
            } else if (appState.accessory === 3) { // نظارات
                accSvg.innerHTML = `
                    <circle cx="100" cy="102" r="17" stroke="#ff4d6d" stroke-width="3" fill="rgba(255,255,255,0.2)"/>
                    <circle cx="150" cy="102" r="17" stroke="#ff4d6d" stroke-width="3" fill="rgba(255,255,255,0.2)"/>
                    <line x1="117" y1="102" x2="133" y2="102" stroke="#ff4d6d" stroke-width="3"/>
                `;
            }
        }

        // تفاعل الرأس مع حركة الماوس أو اللمس (Tilt Effect)
        const stage = document.getElementById('stage-card');
        const doll = document.getElementById('doll-canvas');

        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            doll.style.transform = rotate(${x * 8}deg);
        });

        stage.addEventListener('mouseleave', () => {
            doll.style.transform = rotate(0deg);
        });

        // عشوائي
        document.getElementById('btn-random').addEventListener('click', () => {
            appState.hairStyle = Math.floor(Math.random() * dataHairStyles.length);
            appState.hairColor = dataHairColors[Math.floor(Math.random() * dataHairColors.length)].color;
            appState.outfit = Math.floor(Math.random() * dataOutfits.length);
            appState.accessory = Math.floor(Math.random() * dataAccessories.length);
            appState.skin = dataSkins[Math.floor(Math.random() * dataSkins.length)].color;
            persistState();
            updateChibi();
            renderOptions();
        });

        // تنزيل الصورة
        document.getElementById('btn-save').addEventListener('click', () => {
            const layers = [
                document.getElementById('svg-hair-back'),
                document.getElementById('svg-body'),
                document.getElementById('svg-outfit'),
                document.getElementById('svg-hair-front'),
                document.getElementById('svg-acc')
            ];

            let combinedContent = '';
            layers.forEach(l => { combinedContent += l.innerHTML; });

            const fullSvg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="500" height="720" viewBox="0 0 250 360">
                    <defs>
                        <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#fff0f5"/>
                            <stop offset="100%" stop-color="#ffd6e0"/>
                        </linearGradient>
                    </defs>
                    <rect width="250" height="360" rx="30" fill="url(#bg)"/>
                    <text x="125" y="30" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ff5d8f" text-anchor="middle">🎀 Pookie 16K Celebration 🎀</text>
                    ${combinedContent}
                </svg>
            `;

            const canvas = document.createElement('canvas');
            canvas.width = 500;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            const svgBlob = new Blob([fullSvg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.download = 'my-pookie-chibi-16k.png';
                downloadLink.href = pngUrl;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            };
            img.src = url;
        });

        renderOptions();
        updateChibi();
    </script>
</body>
</html>
